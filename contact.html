<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | PU BSCS Hub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { light: '#3b82f6', DEFAULT: '#1d4ed8', dark: '#1e3a8a' } } } } }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen">

    <!-- Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-brand-dark"><i class="fas fa-arrow-left mr-2"></i> Back to Hub</a>
            <h1 class="font-bold text-slate-700 hidden md:block">Contact Support</h1>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-12 max-w-4xl">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
            
            <!-- Contact Info Sidebar -->
            <div class="bg-brand-dark text-white p-8 md:w-2/5 flex flex-col justify-center">
                <h2 class="text-3xl font-bold mb-4">Get in Touch</h2>
                <p class="text-blue-200 mb-8">Have a question about the notes, found a broken link, or want to contribute past papers? Let us know!</p>
                
                <div class="space-y-4">
                    <a href="https://wa.me/+923290330234" target="_blank" class="flex items-center gap-3 text-lg hover:text-green-400 transition">
                        <i class="fab fa-whatsapp text-2xl"></i> +92 329 0330234
                    </a>
                    <div class="flex items-center gap-3 text-lg">
                        <i class="fas fa-envelope text-2xl"></i> support@sheri.in
                    </div>
                </div>
            </div>

            <!-- Contact Form -->
            <div class="p-8 md:w-3/5">
                <h3 class="text-2xl font-bold text-slate-800 mb-6">Send a Message</h3>
                <form id="contactForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Your Name</label>
                        <input type="text" id="name" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-brand focus:border-brand outline-none" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                        <input type="email" id="email" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-brand focus:border-brand outline-none" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Message</label>
                        <textarea id="message" rows="4" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-brand focus:border-brand outline-none" required></textarea>
                    </div>
                    <button type="submit" class="w-full bg-brand hover:bg-brand-dark text-white font-bold py-3 px-4 rounded-lg transition-colors">
                        Send Message
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Connect your existing JS here -->
    <script src="scripts.js"></script>
</body>
</html>
